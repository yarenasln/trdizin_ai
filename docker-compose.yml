services:

  postgres:
    image: postgres:16
    container_name: trdizin_ai_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trdizin_ai_db

    ports:
      - "5433:5432"

    volumes:
      - trdizin_ai_postgres_data:/var/lib/postgresql/data

volumes:
  trdizin_ai_postgres_data: